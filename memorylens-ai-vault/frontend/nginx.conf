server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's own default (1MB) is far smaller than the backend's 200MB
    # upload limit -- without this, every photo/video upload gets cut off
    # here with a 413 before the backend ever sees the request.
    client_max_body_size 200M;

    # React Router: any path that isn't a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # "backend" resolves via Docker Compose's internal network -- the
    # service name in docker-compose.yml, not localhost.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
