[project]
name = "sonavault-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt[crypto]>=2.9",
    "webauthn>=3.0.1",
    "pyotp>=2.12.1",
    "cryptography>=43.0",
    "redis>=5.1",
    "rq>=2.0",
    "qdrant-client>=1.12",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "lxml>=5.3",
    "python-magic>=0.4.27",
    "prometheus-fastapi-instrumentator>=7.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "fakeredis>=2.26", "httpx>=0.27", "respx>=0.21"]
