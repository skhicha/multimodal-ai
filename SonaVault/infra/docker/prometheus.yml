global:
  scrape_interval: 15s

scrape_configs:
  - job_name: sonavault-api
    static_configs:
      - targets: ["api:9182"]
  - job_name: vllm-moe-gpu
    static_configs:
      - targets: ["vllm-moe-gpu:8000"]
    metrics_path: /metrics
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: mediamtx
    static_configs:
      - targets: ["mediamtx:9998"]
